server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

    # SPA routing: fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the entrypoint / service worker so updates roll out
    location ~* ^/(index\.html|flutter_service_worker\.js|flutter_bootstrap\.js|version\.json)$ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|wasm|png|jpg|svg|ico|ttf|otf|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
    }
}
